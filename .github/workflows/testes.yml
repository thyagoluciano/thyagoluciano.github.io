name: Testes

on:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Testes do exportador (inclui o teste de vazamento com build do Quartz)
        run: |
          pip install pytest pyyaml
          pytest tools/tests -q
      - name: Build do Quartz
        run: npx quartz build
